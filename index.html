<!DOCTYPE html>
<html>
<head>
  <title>My Personal Website</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7ff;
      color: #333;
    }

    /* NAVBAR */
    .navbar {
      background: #1e2a78;
      padding: 15px;
      text-align: center;
    }

    .navbar a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }

    .navbar a:hover {
      text-decoration: underline;
    }

    /* HERO SECTION */
    .hero {
      text-align: center;
      padding: 80px 20px;
      background: white;
    }

    .hero h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 18px;
      color: gray;
    }

    /* SECTIONS */
    .section {
      padding: 60px 20px;
      text-align: center;
    }

    .card {
      background: white;
      padding: 20px;
      margin: 20px auto;
      width: 80%;
      max-width: 500px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    /* BUTTON */
    button {
      padding: 10px 20px;
      background: #1e2a78;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #0f1440;
    }

  </style>
</head>

<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </div>

  <!-- HOME -->
  <div class="hero" id="home">
    <h1>Hi, I'm a Beginner Developer 👨‍💻</h1>
    <p>I am learning HTML, CSS, and JavaScript</p>
  </div>

  <!-- ABOUT -->
  <div class="section" id="about">
    <h2>About Me</h2>
    <div class="card">
      <p>I am learning how to build websites using code. This is my first real project deployed online 🚀</p>
    </div>
  </div>

  <!-- CONTACT -->
  <div class="section" id="contact">
    <h2>Contact Me</h2>
    <div class="card">
      <p>Email: example@gmail.com</p>
      <button onclick="alert('Message sent (fake demo 😄)')">
        Send Message
      </button>
    </div>
  </div>

</body>
</html>
